name: Publicar Dieta HLNutri

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar e gerar o site
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://kdbdvscxfsgzrdpteome.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_7TsVD4ORVd7e0LotS-Sstg_skKqp9Yc

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar os arquivos publicados
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
